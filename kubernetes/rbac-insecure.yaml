apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iac-benchmark-overly-permissive-clusterrole
rules:
  # Misconfiguration: Overly permissive wildcard permissions across all resources
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iac-benchmark-default-admin-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
roleRef:
  kind: ClusterRole
  name: iac-benchmark-overly-permissive-clusterrole
  apiGroup: rbac.authorization.k8s.io
