apiVersion: v1
kind: Pod
metadata:
  name: iac-benchmark-privileged-pod
  namespace: default
  labels:
    app.kubernetes.io/name: iac-benchmark-privileged-pod
spec:
  # Misconfiguration: Host namespace sharing
  hostNetwork: true
  hostPID: true
  hostIPC: true

  # Misconfiguration: Auto-mounting default ServiceAccount API token
  automountServiceAccountToken: true

  containers:
    - name: workload
      image: alpine:3.20.3
      command: ["/bin/sh", "-c", "sleep 3600"]
      
      # Misconfiguration: Container running in privileged mode with full host access
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsNonRoot: false
        runAsUser: 0
        readOnlyRootFilesystem: false
        capabilities:
          add:
            - SYS_ADMIN
            - NET_ADMIN
            - ALL

      # Misconfiguration: Missing CPU and Memory resource limits/requests

      # Misconfiguration: Dangerous host filesystem volume mount
      volumeMounts:
        - mountPath: /host
          name: host-root-mount

  volumes:
    - name: host-root-mount
      hostPath:
        path: /
