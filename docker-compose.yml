services:
  # Test Case A: Vulnerable Runtime (PHP 8.3.35)
  # Targeted CVEs: CVE-2026-109618, CVE-2026-109619
  vulnerable-runtime:
    build:
      context: .
      dockerfile: Dockerfile.vulnerable
    image: php2shell-security-test:vulnerable
    container_name: php2shell-vulnerable
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - APP_ENV=test
      - TEST_CASE=vulnerable_runtime
    restart: "no"

  # Test Case B: Patched Runtime Control Case (PHP 8.3.36)
  # Expected: Zero CVE findings on fixed release
  patched-runtime:
    build:
      context: .
      dockerfile: Dockerfile.patched
    image: php2shell-security-test:patched
    container_name: php2shell-patched
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - APP_ENV=test
      - TEST_CASE=patched_runtime
    restart: "no"
