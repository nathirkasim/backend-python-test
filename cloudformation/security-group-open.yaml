AWSTemplateFormatVersion: '2010-09-09'
Description: 'IaC Benchmark: Insecure Security Group CloudFormation Template'

Resources:
  InsecureSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Security group allowing unrestricted inbound SSH access'
      SecurityGroupIngress:
        # Misconfiguration: Open SSH ingress from 0.0.0.0/0
        - IpProtocol: 'tcp'
          FromPort: 22
          ToPort: 22
          CidrIp: '0.0.0.0/0'
          Description: 'Allow SSH from anywhere'
        # Misconfiguration: Open RDP ingress from 0.0.0.0/0
        - IpProtocol: 'tcp'
          FromPort: 3389
          ToPort: 3389
          CidrIp: '0.0.0.0/0'
          Description: 'Allow RDP from anywhere'
